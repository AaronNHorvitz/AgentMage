name: Product

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - agent/expand-delivery-windows-ga
      - main

permissions:
  contents: read

jobs:
  contract:
    name: Product CI Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate product CI contract
        run: python3 scripts/product_ci.py --check

  format:
    name: Product Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.12.1
      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Validate toolchains
        run: python3 scripts/product_ci.py --check-environment all
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run format lane
        run: python3 scripts/product_ci.py --run-lane format

  lint:
    name: Product Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.12.1
      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Validate toolchains
        run: python3 scripts/product_ci.py --check-environment all
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run lint lane
        run: python3 scripts/product_ci.py --run-lane lint

  build:
    name: Product Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.12.1
      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Validate toolchains
        run: python3 scripts/product_ci.py --check-environment all
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run build lane
        run: python3 scripts/product_ci.py --run-lane build

  rust_unit_contract:
    name: Rust Unit and Contract Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Validate Rust toolchain
        run: python3 scripts/product_ci.py --check-environment rust
      - name: Run Rust unit and contract lane
        run: python3 scripts/product_ci.py --run-lane rust-unit-contract

  vscode_shell:
    name: VS Code Shell Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.12.1
      - name: Validate Node toolchain
        run: python3 scripts/product_ci.py --check-environment node
      - name: Validate npm toolchain
        run: python3 scripts/product_ci.py --check-environment npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run VS Code shell lane
        run: python3 scripts/product_ci.py --run-lane vscode-shell

  native_linux_status:
    name: Native Linux Evidence (Pending Execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Validate Rust toolchain
        run: python3 scripts/product_ci.py --check-environment rust
      - name: Inventory tests requiring native execution
        run: python3 scripts/product_ci.py --inventory-native

  windows_contract:
    name: Windows Native Identity Evidence (Partial Boundary)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Test native Windows identity boundary
        shell: pwsh
        run: |
          cargo +1.95.0 test -p agentmage-platform-windows --locked
          cargo +1.95.0 run -p agentmage-platform-windows --bin native_evidence --locked | Set-Content -Encoding utf8 windows-native-identity.json
          $record = Get-Content -Raw windows-native-identity.json | ConvertFrom-Json
          if (-not $record.native_windows -or -not $record.process_identity_observed -or -not $record.session_identity_observed -or -not $record.elevation_observed -or -not $record.user_sid_digest_nonzero -or -not $record.executable_digest_nonzero) {
            throw "Windows native identity evidence is incomplete"
          }
          $record | Add-Member -NotePropertyName source_sha -NotePropertyValue $env:GITHUB_SHA
          $record | Add-Member -NotePropertyName runner_image -NotePropertyValue $env:ImageOS
          $record | ConvertTo-Json -Compress | Set-Content -Encoding utf8 windows-native-identity.json
      - name: Retain commit-bound native Windows evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-identity-${{ github.sha }}
          path: windows-native-identity.json
          if-no-files-found: error
          retention-days: 14
