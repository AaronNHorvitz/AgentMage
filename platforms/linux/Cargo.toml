[package]
name = "agentmage-platform-linux"
description = "Fedora and Ubuntu AgentMage platform adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-support = []
public-research-worker = ["dep:ureq", "dep:url"]

[[bin]]
name = "agentmage-public-research-worker"
path = "src/bin/agentmage-public-research-worker.rs"
required-features = ["public-research-worker"]

[dependencies]
agentmage-kernel-contracts.workspace = true
agentmage-kernel-engine = { workspace = true, features = ["runtime-projections", "source-preparation", "verified-workflow-supervisor"] }
chacha20poly1305.workspace = true
hkdf.workspace = true
rustix.workspace = true
seccompiler.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
zeroize.workspace = true
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
url = { version = "=2.5.8", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
