[workspace]
members = [
  "capabilities/read-only",
  "kernel/contracts",
  "kernel/engine",
  "platforms/linux-inference",
  "platforms/linux",
  "platforms/windows",
  "release/xtask",
  "shells/host",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/AaronNHorvitz/AgentMage"
publish = false

[workspace.dependencies]
agentmage-capability-read-only = { path = "capabilities/read-only" }
agentmage-kernel-contracts = { path = "kernel/contracts" }
agentmage-kernel-engine = { path = "kernel/engine" }
agentmage-platform-linux-inference = { path = "platforms/linux-inference" }
agentmage-platform-linux = { path = "platforms/linux" }
agentmage-platform-windows = { path = "platforms/windows" }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "signature", "zeroize"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "net", "process", "rand", "std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled-sqlcipher"] }
seccompiler = { version = "=0.5.0", default-features = false, features = ["json"] }
sha2 = "=0.11.0"
unicode-normalization = "=0.1.25"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
